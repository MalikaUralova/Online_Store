<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container" style="padding: 40px 20px;">
        <div id="wishlistPageContainer"></div>
    </div>

    <script>
        const wishlistContainer = document.querySelector("#wishlistPageContainer");
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        function renderWishlistPage() {
            if (!wishlistContainer) return;

            if (wishlist.length === 0) {
                wishlistContainer.innerHTML = `
                    <div style="text-align: center; padding: 80px 20px;">
                        <h2 style="font-size: 28px; margin-bottom: 10px;">Your Wishlist is Empty</h2>
                        <p style="color: #888; margin-bottom: 25px;">Add some products to your wishlist to see them here.</p>
                        <a href="../index.html" style="background: #2563eb; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 500; display: inline-block;">Continue Shopping</a>
                    </div>
                `;
            } else {
                let cardsHTML = "";
                wishlist.forEach(function (item) {
                    const { id, title, price, description, image } = item;

                    cardsHTML += `
                        <div class="product-card" style="position: relative;">
                            <button class="like-btn active" onclick="removeFromWishlist(${id})" title="Remove">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                            <div class="product-img-box">
                                <img class="image" src="${image}" alt="${title}" />
                            </div>
                            <div class="product-info">
                                <div>
                                    <h3 class="product-title">${title}</h3>
                                    <p class="product-desc">${description ? description : ''}</p>
                                </div>
                                <div class="product-price">$${price}</div>
                            </div>
                            <button class="add-to-cart-btn" onclick="addToCartFromWishlist(${id})">Add to Cart</button>
                        </div>
                    `;
                });

                wishlistContainer.innerHTML = `
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 style="font-size: 24px;">My Wishlist (${wishlist.length} items)</h2>
        <button onclick="clearWishlist()" style="background: transparent; border: 1px solid #444; color: inherit; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Clear Wishlist</button>
    </div>
    <!-- Asosiy sahifadagi grid klassingizni shu yerga yozing -->
    <div class="products-grid"> 
        ${cardsHTML}
    </div>
`;
            }
        }

        window.removeFromWishlist = function (id) {
            wishlist = wishlist.filter(item => item.id !== id);
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
            renderWishlistPage();
        };

        window.addToCartFromWishlist = function (id) {
            const product = wishlist.find(p => p.id === id);
            if (!product) return;

            const existing = cart.find(p => p.id === id);
            if (existing) {
                existing.quantity = (Number(existing.quantity) || 1) + 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            alert("Product added to cart!");
        };

        window.clearWishlist = function () {
            localStorage.removeItem("wishlist");
            wishlist = [];
            renderWishlistPage();
        };

        renderWishlistPage();
    </script>
</body>

</html>
